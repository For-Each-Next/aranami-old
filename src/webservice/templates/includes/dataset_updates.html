{% set updates = server.dataset_updates | default({}) %}
<div class="dataset-job-sections">
{% for section in ("current", "previous") %}
{% set model = updates.get(section, {}) %}
<section id="dataset-updates-{{ section }}" class="dataset-updates section-flat" aria-labelledby="dataset-updates-{{ section }}-heading"{% if section == 'previous' %} data-live-key="{{ model.key | default('') }}"{% endif %}>
<h2 id="dataset-updates-{{ section }}-heading">{{ t.dataset_updates.schedule if section == 'current' else t.dataset_updates.previous }}</h2>
{% include "includes/dataset_update_cards.html" %}
</section>
{% endfor %}
</div>
