<div id="server-runtime" class="ui-table">
<div class="ui-table__table-wrapper table-scroll" tabindex="0" role="region" aria-labelledby="server-status-heading">
<table class="ui-table__table server-jobs" data-no-pagination>
<caption class="visually-hidden">{{ t.server.heading }}</caption>
<thead><tr>
<th scope="col">{{ t.server.job }}</th>
<th scope="col">{{ t.server.job_type }}</th>
<th scope="col">{{ t.server.state }}</th>
<th scope="col">{{ t.server.memory }}</th>
<th scope="col">{{ t.server.cpu }}</th>
</tr></thead>
<tbody>
{% for job in server.jobs %}
<tr data-key="{{ job.key }}">
<th scope="row" title="{{ job.name }}">{{ job.key }}</th>
<td{% if job.cron %} title="{{ job.cron }}"{% endif %}>{{ job.type }}</td>
<td><span{% if job.expires %} data-observation-expires="{{ job.expires }}" data-stale-text="{{ t.server.job_unknown }}"{% endif %}>{{ job.status }}</span></td>
{% for metric in ('memory', 'cpu') %}
<td><span{% if job.expires %} data-observation-expires="{{ job.expires }}" data-stale-text="{{ job.idle_usage[metric] }}"{% endif %}>{{ job.usage[metric] }}</span></td>
{% endfor %}
</tr>
{% endfor %}
</tbody></table>
</div></div>
